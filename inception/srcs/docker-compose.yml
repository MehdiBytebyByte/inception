services:
  # ==============================
  # 1. MariaDB (The Database)
  # ==============================
  mariadb:
    container_name: mariadb
    build: requirements/mariadb
    image: mariadb:inception
    env_file: .env
    # Persist database data so it survives restarts
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: always

  # ==============================
  # 2. WordPress (The Application)
  # ==============================
  wordpress:
    container_name: wordpress
    build: requirements/wordpress
    image: wordpress:inception
    env_file: .env
    # Depends on MariaDB starting first
    depends_on:
      - mariadb
    # Share the website files with NGINX
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: always

  # ==============================
  # 3. NGINX (The Web Server)
  # ==============================
  nginx:
    container_name: nginx
    build: requirements/nginx
    image: nginx:inception
    env_file: .env
    # The only port exposed to the outside world (HTTPS)
    ports:
      - "443:443"
    # Depends on WordPress to generate the files first
    depends_on:
      - wordpress
    # Read the files generated by the WordPress container
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: always

# ==============================
# Volumes (Storage)
# ==============================
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      # UPDATED: Simplified path (removed /data/)
      device: /home/mboughra/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      # UPDATED: Simplified path (removed /data/)
      device: /home/mboughra/wordpress

# ==============================
# Network (Communication)
# ==============================
networks:
  inception:
    driver: bridge